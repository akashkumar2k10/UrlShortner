<div class="container mt-4">
  <h2 class="mb-4">Link Management</h2>

  <form (ngSubmit)="onSubmit()" #simpleForm="ngForm">
    <div>
      <label for="textInput">Text Input:</label>
      <input 
        type="text" 
        id="textInput" 
        name="textInput" 
        [(ngModel)]="textInput" 
        required 
      />
    </div>
    <button type="submit" [disabled]="simpleForm.invalid">Submit</button>
  </form>


  <!-- List of links -->
  <div class="list-group">
    <div *ngFor="let link of links" class="list-group-item list-group-item-action">
      <div class="d-flex w-100 justify-content-between align-items-center">
        <a href="{{'http://localhost:8081/s/' + link.shortUrl}}" target="_blank"><h5 class="mb-1">{{link.shortUrl}}</h5></a>
        <small>
          <button class="btn btn-sm btn-outline-danger" (click)="deleteLink(link.id)">Delete</button>
          <button class="btn btn-sm btn-outline-warning" (click)="disableLink(link.id)">Disable</button>
          <button class="btn btn-primary" (click)="generateQr(link.id)">Generate QR code</button>
          <button class="btn btn-success" (click)="enableLink(link.id)">Enable</button>

          
        </small>
      </div>
      <p class="mb-1">{{link.longUrl}}</p>
      <p class="mb-1">{{link.validTill}}</p>
    </div>
  </div>



  
</div>
