# fly.toml app configuration file generated for keygenrator on 2025-08-19T11:37:02+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'keygenrator'
primary_region = 'bom'

[build]
  image = 'akashkumar2k10/keygenrator'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
