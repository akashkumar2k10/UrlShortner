apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keygenrator-ingress
  annotations:
    kubernetes.io/ingress.class: gce
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keygenrator-service
                port:
                  number: 8080
          - path: /url
            pathType: Prefix
            backend:
              service:
                name: urlshortner-service
                port:
                  number: 8080         
