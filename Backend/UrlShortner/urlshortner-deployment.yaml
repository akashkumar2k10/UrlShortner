apiVersion: apps/v1

kind: Deployment
metadata:
  name: urlshortner
spec:
  replicas: 2
  selector:
    matchLabels:
      app: urlshortner
  template:
    metadata:
      labels:
        app: urlshortner
    spec:
      containers:
        - name: urlshortner
          image: akashkumar2k10/urlshortner:latest
          env:
            - name: KEY_BASE_URL
              value: "http://keygenrator-service:8080/"
            - name: URL_SHORTNER_BASE_URL
              value: "http://urlshortner-service:8080/"
          ports:
            - containerPort: 8081
          livenessProbe:
            httpGet:
              path: urlshortner/actuator/health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: urlshortner/actuator/health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: urlshortner-service
spec:
  type: NodePort
  selector:
    app: urlshortner
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8081
