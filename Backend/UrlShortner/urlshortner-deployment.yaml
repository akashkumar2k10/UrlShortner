apiVersion: apps/v1

kind: Deployment
metadata:
  name: urlshortner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: urlshortner
  template:
    metadata:
      labels:
        app: urlshortner
    spec:
      containers:
        - name: urlshortner
          image: akashkumar2k10/urlshortner:0.3
          env:
            - name: KEY_BASE_URL
              value: "http://35.193.13.111:8080/"
            - name: URL_SHORTNER_BASE_URL
              value: "http://34.134.187.209:8080/"
          ports:
            - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: urlshortner-service
spec:
  type: LoadBalancer
  selector:
    app: urlshortner
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8081
